[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="infraguard-ai"
version="0.1.0"
description="Defensive simulation lab for trustworthy AI and cyber resilience in critical-infrastructure-style IT/OT/ICS environments."
requires-python=">=3.10"
dependencies=[]
[project.optional-dependencies]
api=["fastapi>=0.115,<1","uvicorn>=0.30,<1"]
[project.scripts]
infraguard="infraguard.cli:main"
[tool.setuptools.packages.find]
include=["infraguard*"]
